<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Installation électrique – Académie Fnac Darty</title>
<meta name="description" content="E-learning livreurs-installateurs : limites d'intervention sur l'installation électrique du client.">
<style>:root{--black:#111;--ink:#1d1d1f;--yellow:#E9AB00;--yellow-l:#FFF3CC;--orange:#F26B43;--red:#C10F1E;--red-l:#FDECEE;--green:#0B8A43;--green-l:#E4F5EB;--bg:#F1F1F1;--card:#fff;--line:#E1E1E1;--mut:#5b5b5f}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.45;min-height:100vh}
button{font:inherit;cursor:pointer}
header{background:var(--black);color:#fff;position:relative;overflow:hidden}
.hd{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.hd img{height:72px;width:auto;display:block}
.hd h1{font-size:20px;line-height:1.15;margin:0;font-weight:700;flex:1}
.hd h1 small{display:block;font-weight:400;font-size:14px;color:#cfcfcf;margin-top:2px}
.chev{position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(180deg,#FBAE40,#C10F1E);clip-path:polygon(60% 0,100% 0,100% 100%,60% 100%,100% 50%);opacity:.95}
.hd .pg{font-size:14px;text-align:right;color:#ddd;margin-right:70px;white-space:nowrap}
.bar{height:5px;background:#333}.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .4s}
nav.steps{background:#fff;border-bottom:1px solid var(--line)}
nav.steps .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;padding:8px 20px;overflow-x:auto}
nav.steps button{flex:1 1 0;min-width:150px;border:0;background:#f4f4f4;border-radius:10px;padding:8px 12px;text-align:left;color:#333;display:flex;gap:10px;align-items:center;border:2px solid transparent}
nav.steps button .n{width:28px;height:28px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
nav.steps button .l{font-size:15px;line-height:1.15;font-weight:600}
nav.steps button .l small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
nav.steps button.on{border-color:var(--yellow);background:#fff}
nav.steps button.on .n{background:var(--black);color:var(--yellow)}
nav.steps button.done .n{background:var(--green);color:#fff}
main{max-width:1080px;margin:0 auto;padding:22px 20px 40px}
.screen{background:var(--card);border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.07);padding:28px 30px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 4px}
h2{font-size:30px;line-height:1.15;margin:0 0 14px}
h3{font-size:20px;margin:0 0 8px}
p{margin:0 0 12px}
.lead{font-size:20px;color:#333}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.box.ok{border-color:#9ad4b3;background:var(--green-l)}
.box.ko{border-color:#ee9aa2;background:var(--red-l)}
.box.key{border-color:var(--yellow);background:var(--yellow-l)}
.box h3{display:flex;gap:8px;align-items:center}
.ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:15px;font-weight:700;color:#fff;flex:none}
.ico.ok{background:var(--green)}.ico.ko{background:var(--red)}.ico.w{background:var(--yellow);color:#111}
ul.l{margin:0;padding-left:0;list-style:none}
ul.l li{padding:5px 0 5px 28px;position:relative}
ul.l li:before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--yellow)}
ul.ok li:before{background:var(--green)}ul.ko li:before{background:var(--red)}
.callout{border-left:6px solid var(--yellow);background:var(--yellow-l);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.callout.red{border-color:var(--red);background:var(--red-l)}
.callout.green{border-color:var(--green);background:var(--green-l)}
.imgc{text-align:center}.imgc img{max-width:100%;max-height:230px;border-radius:10px;object-fit:contain}
.cap{font-size:14px;color:var(--mut);margin-top:4px}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;background:#eee}
.pill.ok{background:var(--green);color:#fff}.pill.ko{background:var(--red);color:#fff}.pill.w{background:var(--yellow);color:#111}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#d0d0d0}.dots i.on{background:var(--yellow);transform:scale(1.25)}.dots i.past{background:var(--black)}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:17px;background:var(--black);color:#fff}
.btn:hover{background:#333}.btn.y{background:var(--yellow);color:#111}.btn.y:hover{background:#f4b91a}
.btn.ghost{background:#fff;color:#111;border:2px solid #ccc}.btn.ghost:hover{background:#f4f4f4}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:17px;display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--yellow);background:var(--yellow-l)}
.opt .k{width:28px;height:28px;border-radius:8px;background:#eee;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.opt.right{border-color:var(--green);background:var(--green-l)}.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l)}.opt.wrong .k{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:12px 16px;border-radius:10px;display:none}
.fb.show{display:block}.fb.ok{background:var(--green-l);border-left:6px solid var(--green)}.fb.ko{background:var(--red-l);border-left:6px solid var(--red)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-weight:600;font-size:16px}
.tab.on{background:var(--black);color:#fff;border-color:var(--black)}
table.t{border-collapse:collapse;width:100%;font-size:16px}
table.t th{background:var(--black);color:#fff;text-align:left;padding:8px 10px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.t tr:nth-child(even) td{background:#fafafa}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
.steps5 .st{border-radius:12px;background:#fff;border:1px solid var(--line);padding:14px 12px;position:relative;text-align:center}
.steps5 .st b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--yellow);color:#111;margin:0 auto 8px;font-size:18px}
.steps5 .st.last{background:var(--black);color:#fff}.steps5 .st.last b{background:var(--red);color:#fff}
.hero{background:var(--black);color:#fff;border-radius:16px;padding:34px 36px;display:flex;gap:26px;align-items:center;position:relative;overflow:hidden}
.hero img{height:150px;flex:none}
.hero h2{font-size:34px;color:#fff;margin-bottom:8px}.hero .lead{color:#ddd}
.hero:after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:linear-gradient(180deg,#FBAE40,#C10F1E);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,100% 50%)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.path button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left}
.path button:hover{border-color:var(--yellow);box-shadow:0 3px 12px rgba(0,0,0,.08)}
.path .num{font-size:30px;font-weight:800;color:var(--yellow);line-height:1}
.path .mn{font-size:14px;color:var(--mut)}
.score{font-size:64px;font-weight:800;line-height:1}
.qbar{height:8px;border-radius:5px;background:#e5e5e5;margin-bottom:18px}.qbar i{display:block;height:100%;border-radius:5px;background:var(--yellow);transition:width .3s}
.sel{font:inherit;padding:9px 10px;border-radius:8px;border:2px solid #ccc;background:#fff;max-width:100%}
.sel.right{border-color:var(--green);background:var(--green-l)}.sel.wrong{border-color:var(--red);background:var(--red-l)}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;margin:8px 0}
.sock text{font-family:inherit}
.meas{font-weight:800}
@media(max-width:820px){body{font-size:17px}.grid2,.grid3,.grid4,.path{grid-template-columns:1fr}.steps5{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center;padding:26px 20px}.hero img{height:110px}.screen{padding:20px 16px}h2{font-size:25px}.hd h1{font-size:16px}.hd img{height:56px}.hd .pg{display:none}.chev{width:50px}.mrow{grid-template-columns:1fr}}

.vo{max-width:1080px;margin:0 auto;padding:12px 20px 0}
.vo .in{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vo button.vb{border:2px solid var(--black);background:var(--black);color:#fff;border-radius:99px;padding:5px 14px;font-weight:700;font-size:15px}
.vo button.vb.g{background:#fff;color:#111;border-color:#ccc}
.vo details{flex:1 1 100%;font-size:15px;color:#333}.vo summary{cursor:pointer;color:var(--mut)}
.vo details p{margin:6px 0 2px}
footer.cr{max-width:1080px;margin:0 auto;padding:0 20px 24px;font-size:12.5px;color:var(--mut)}
</style></head><body>

wwopTZeZrAbIwpq0C9uyzH3wZA0UBRw2ENvtZbAIGgdckdct1vEIDB6OsLvmh1WA8BBQwpjwcfVsNI/EgeAbUYQ8qr1y0OiP5wzQgsamhqyXMG4ByDIWXxe9TCd97BiropTSwBfAAkBmFQIv7uq7HMb21G6c+AZF8M8uJtL8OyzAQgAwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLi7bB/wMjRRd9MoIUSAAAAABJRU5ErkJggg=="};const NARR={"home": "Bienvenue dans ce module de l'Académie Fnac Darty. En une vingtaine de minutes, vous allez voir ce que vous avez le droit de faire, et ce que vous devez refuser, quand vous installez un gros électroménager ou un téléviseur chez un client. Le parcours comporte trois items, puis un quiz de dix questions. Pour valider, il faut au moins huit bonnes réponses. Cliquez sur Commencer.", "m1_s1": "Vous arrivez chez le client pour installer un lave-linge. La prise a l'air normale, et le client est pressé. Qu'avez-vous le droit de faire ? Et que devez-vous refuser ? À la fin de cet item, vous saurez distinguer ce que vous pouvez contrôler de ce qui relève d'un électricien, vérifier la prise et le circuit avant de brancher, et décider : j'installe, je m'arrête, ou je trace.", "m1_s2": "Votre rôle : vous contrôlez, vous ne modifiez pas. Vous pouvez identifier visuellement l'installation, contrôler la prise avec un V.A.T., lire le repérage au tableau électrique, constater et signaler une anomalie, et refuser le raccordement en cas de doute. Vous ne modifiez pas l'installation, vous ne changez ni un disjoncteur ni la section des fils, vous ne réparez pas un pot d'encastrement, et vous ne bricolez pas d'adaptation pour dépanner. Être habilité B.S., c'est savoir travailler en sécurité, ce n'est pas devenir électricien. La règle d'or : en cas de doute, aucun branchement, et le client fait appel à un électricien.", "m1_s3": "Un seul outil est réglementaire pour vérifier l'absence de tension : le V.A.T., le Vérificateur d'Absence de Tension. Ni le tournevis testeur, ni le multimètre ne le remplacent. Avant de l'utiliser, vérifiez le V.A.T. lui-même : contrôle visuel du boîtier, des cordons et des pointes de touche ; connexion des pointes sur le dispositif de test ; vérification de la réaction des voyants, de l'affichage ou du signal sonore. Si rien ne réagit, changez les piles, sinon le V.A.T. est hors service. Testez-le avant et après la mesure.", "m1_s4": "Mesurez la tension entre phase et neutre, entre phase et terre, puis entre neutre et terre. Sur une prise conforme, vous trouvez environ deux cent trente volts entre phase et neutre, deux cent trente volts entre phase et terre, et zéro volt entre neutre et terre. Trois cas sont à refuser. Mauvaise terre : plus de cinq volts entre neutre et terre. Absence de terre : aucune tension entre phase et terre. Neutre coupé : zéro volt partout, mais les voyants du V.A.T. clignotent. Touchez chaque cas pour voir le résultat.", "m1_s5": "À vous de décider. Pour chaque mesure, dites si vous branchez ou non. Au moindre écart, on ne branche pas.", "m1_s6": "À retenir. Je contrôle, je ne modifie pas l'installation. Seul le V.A.T. est réglementaire, et je le teste avant et après. Je contrôle la prise avant chaque branchement. Neutre terre supérieur à cinq volts, pas de terre, ou neutre coupé : je ne branche pas. Dans le doute, je refuse et je trace. Passons à l'item deux : le circuit au tableau électrique.", "m2_s1": "Un circuit spécialisé alimente un seul appareil : lave-linge, lave-vaisselle, sèche-linge, four ou plaque de cuisson. Il part du tableau avec sa propre protection, comme le prévoit la norme N.F.C. quinze cent. Pour un lave-linge : un circuit dédié avec une seule prise, un différentiel de trente milliampères de type A, un disjoncteur de vingt ampères maximum, des conducteurs de deux virgule cinq millimètres carrés minimum, et la terre obligatoire. Le tableau vous donne les repères pour les autres appareils : par exemple, une plaque de cuisson monophasée est en six millimètres carrés, avec un disjoncteur de trente-deux ampères.", "m2_s2": "Deux protections à repérer au tableau. D'abord, le différentiel trente milliampères : il a un bouton TEST et indique sa sensibilité, trente milliampères, qui protège les personnes. Il est souvent en tête de rangée. Ensuite, le disjoncteur adapté : pour un lave-linge, un C vingt ampères dédié, avec le chiffre vingt inscrit sur le levier.", "m2_s3": "Comment retrouver le bon disjoncteur ? Méthode un : lisez l'étiquette du tableau, par exemple lave-linge ou buanderie. Méthode deux, si le tableau n'est pas repéré : faites fonctionner l'appareil, abaissez les disjoncteurs un par un jusqu'à ce qu'il s'arrête, puis réenclenchez. Méthode trois, si vous êtes habilité et formé : utilisez le V.A.T. sur la prise et coupez les disjoncteurs un par un jusqu'à l'absence de tension.", "m2_s4": "Prise dédiée ou prise confort ? Ne concluez jamais sur l'apparence. Étape un, observez l'emplacement : c'est un indice, pas une preuve. Étape deux, regardez le tableau. Étape trois, vérifiez l'usage : plusieurs prises sur la ligne, une multiprise, d'autres appareils branchés, c'est une suspicion de prise confort. Mini-défi : d'après la photo, la prise du sèche-linge est-elle dédiée ?", "m2_s5": "La section des fils, en trois étapes. Un : lisez le marquage sur la gaine. Deux : comparez avec les repères de la pince. Trois : vérifiez le disjoncteur au tableau. Ne vous fiez jamais uniquement à la grosseur du fil. Vous ne démontez pas l'installation, vous ne coupez pas le câble pour vérifier, vous ne réduisez pas la section. Section différente, disjoncteur incompatible ou conducteur non identifiable : vous arrêtez l'intervention et vous appliquez la procédure.", "m2_s6": "Vérifiez vos repères : associez chaque appareil à son circuit.", "m2_s7": "À retenir. Un gros appareil, c'est un circuit spécialisé avec sa protection. Lave-linge : trente milliampères type A, C vingt, deux virgule cinq millimètres carrés, et la terre. Différentiel : bouton TEST et valeur en milliampères. Prise dédiée : un indice n'est pas une preuve. Section : marquage, comparaison, disjoncteur. Un doute : j'arrête. Item suivant : les interdits, les cas terrain et la procédure.", "m3_s1": "Voici ce qui est formellement interdit pour un gros électroménager de classe un. Brancher sur une multiprise, une triplette ou une rallonge. Couper une prise moulée. Raccorder une prise seize ampères sur un cordon qui n'en est pas équipé d'usine. Installer un socle seize ampères sur un boîtier à dominos ou connecteurs rapides. Brancher sans raccordement à la terre. Brancher à moins de soixante centimètres d'une douche ou d'une baignoire. Retirer le top d'un appareil pose libre sans suivre les recommandations du constructeur. Et installer deux produits sur un même boîtier de raccordement. Une prise moulée se branche : elle ne se coupe pas, ne se démonte pas, ne se modifie pas.", "m3_s2": "Six situations, une décision. Pot d'encastrement absent ou cassé : non, vous ne posez pas la prise. Vous arrêtez, vous photographiez, et vous laissez l'appareil débranché. Prise seize ampères sur une ligne six millimètres carrés protégée en trente-deux ampères : non. Le problème n'est pas la section, mais la protection : le client fait adapter le disjoncteur par un électricien. Appareil six millimètres carrés monophasé sur une installation triphasée deux virgule cinq : non, vous informez et vous tracez. Fils avec bagues incompatibles : vous ne coupez jamais la bague. Fiche mâle sur le câble : seulement avec une pièce d'origine ou validée par le constructeur. Domino ou Wago : les dominos sont tolérés s'ils sont adaptés à la section, mais les connecteurs Wago d'origine sont fortement préconisés. Un Wago deux cent vingt et un va jusqu'à quatre millimètres carrés : il n'est pas adapté à du six. Parcourez chaque cas.", "m3_s3": "Je peux, ou je m'arrête ? Pour chaque action, choisissez la bonne réponse.", "m3_s4": "Quand vous ne pouvez pas brancher, suivez cinq étapes. Un : je m'arrête, sans adaptation improvisée. Deux : j'informe le client, qui fait appel à un électricien. Trois : je photographie l'anomalie. Quatre : je laisse l'appareil débranché. Cinq : je trace dans Nomad. Tout branchement non effectué doit être mentionné au dossier. Votre compte rendu protège le client, vous et l'entreprise.", "m3_s5": "Mise en situation. Le pot est cassé, le placo est abîmé, et le client insiste : « branchez quand même, mon beau-frère réparera ». Que faites-vous ?", "m3_s6": "À retenir. Jamais de multiprise, de triplette ou de rallonge. Une prise moulée ne se coupe pas. Pas de terre, pas de branchement. Aucune modification de la protection, de la section ou du câblage. Pot absent ou abîmé : j'arrête. Dominos tolérés, Wago d'origine préconisés, selon la section. Je photographie, je laisse l'appareil débranché et je trace dans Nomad. Vous êtes prêt pour le quiz final.", "q1": "Question 1. Quel appareil est le seul réglementaire pour vérifier l'absence de tension sur une prise ? Réponse A : un multimètre. B : un tournevis testeur. C : un V.A.T. D : un détecteur de tension sans contact.", "q2": "Question 2. Vous mesurez : phase neutre, deux cent trente volts ; phase terre, deux cents volts ; neutre terre, trente volts. Que faites-vous ? A : je branche, la tension est présente. B : je ne branche pas, mauvaise terre, le client appelle un électricien. C : je branche en laissant l'appareil éteint. D : je change la prise.", "q3": "Question 3. La prise du lave-linge n'a pas de terre. Votre décision ? A : je branche, le lave-linge a une double isolation. B : je refuse le raccordement, je trace et j'oriente le client vers un électricien. C : je relie la terre sur le neutre. D : je branche sur une rallonge avec terre.", "q4": "Question 4. Que signifie être habilité B.S. pour un livreur-installateur ? A : pouvoir modifier le tableau du client. B : savoir travailler en sécurité face au risque électrique, sans remplacer la formation métier. C : pouvoir remettre une installation en conformité. D : pouvoir remplacer un disjoncteur.", "q5": "Question 5. Quel ensemble correspond à un circuit spécialisé pour lave-linge ? A : disjoncteur trente-deux ampères, six millimètres carrés, différentiel trente milliampères. B : disjoncteur vingt ampères, deux virgule cinq millimètres carrés, différentiel trente milliampères type A, terre. C : disjoncteur vingt ampères, un virgule cinq millimètre carré, sans différentiel. D : disjoncteur seize ampères, deux virgule cinq millimètres carrés, différentiel trois cents milliampères.", "q6": "Question 6. Une seconde prise est visible à côté de celle du lave-linge. Peut-on affirmer que la prise n'est pas dédiée ? A : oui, deux prises, c'est une prise confort. B : non, c'est un indice : je vérifie le tableau et les autres usages sur le circuit. C : oui, sauf si elle est blanche. D : non, une prise est toujours dédiée.", "q7": "Question 7. Câble six millimètres carrés protégé en trente-deux ampères, appareil avec fiche seize ampères. Pouvez-vous poser directement une prise femelle seize ampères ? A : oui, six millimètres carrés, c'est largement suffisant. B : oui, si je réduis la section des fils. C : non, la protection trente-deux ampères est inadaptée, le client doit faire adapter le disjoncteur par un électricien. D : oui, avec un domino.", "q8": "Question 8. Le pot d'encastrement est cassé et le placo abîmé. Quelle est la bonne réaction ? A : je répare avec du plâtre et je branche. B : j'arrête le raccordement, je photographie, je laisse l'appareil débranché et je trace dans Nomad. C : je branche sur une rallonge. D : je fixe la prise avec du ruban adhésif.", "q9": "Question 9. Quelle affirmation sur dominos et connecteurs Wago est exacte ? A : les dominos sont interdits, seuls les Wago sont autorisés. B : les épissures au ruban sont autorisées. C : dominos tolérés s'ils sont adaptés à la section ; Wago d'origine préconisés ; un Wago deux cent vingt et un n'est pas adapté au six millimètres carrés. D : un Wago convient pour toutes les sections.", "q10": "Question 10. Quand un branchement n'a pas pu être réalisé, que faut-il faire ? A : rien, le client gérera. B : le mentionner dans le dossier Nomad : appareil laissé débranché. C : le dire oralement au client suffit. D : brancher quand même après accord oral du client.", "res_ok": "Bravo, module validé. Vous connaissez les limites de votre intervention. En cas de doute sur le terrain : je ne branche pas, je préviens, je trace.", "res_ko": "Le module n'est pas encore validé : il faut au moins huit bonnes réponses sur dix. Revoyez les items concernés, puis refaites le quiz."};</script>
<script>/* ===== Utilitaires ===== */

const KEY='fd-hab-elec-v1';

let cur=-1,scr=0;
/* ===== SCORM 1.2 ===== */
const SC=(function(){
 let api=null,passed=false,closed=false;const t0=Date.now();
 const find=w=>{let n=0;try{while(w){if(w.API)return w.API;if(w.parent&&w.parent!==w&&n++<20)w=w.parent;else break}}catch(e){}return null};
 try{api=find(window)||(window.opener?find(window.opener):null)}catch(e){}
 const g=k=>{try{return String(api.LMSGetValue(k))}catch(e){return ''}};
 const st=(k,v)=>{try{api.LMSSetValue(k,String(v))}catch(e){}};
 const cm=()=>{try{api.LMSCommit('')}catch(e){}};
 const p2=n=>('0'+n).slice(-2);
 const fmt=ms=>{const t=Math.round(ms/1000);return ('000'+Math.floor(t/3600)).slice(-4)+':'+p2(Math.floor(t%3600/60))+':'+p2(t%60)};
 return{
  active:()=>!!api,
  init(){if(!api)return null;
   try{api.LMSInitialize('')}catch(e){api=null;return null}
   const s=g('cmi.core.lesson_status');
   if(s==='not attempted'||s==='')st('cmi.core.lesson_status','incomplete');
   passed=(s==='passed'||s==='completed');
   let sd=null;try{sd=JSON.parse(g('cmi.suspend_data')||'null')}catch(e){}
   cm();return sd},
  sync(){if(!api)return;st('cmi.suspend_data',JSON.stringify({d:ST.done,b:ST.best,l:[cur,scr]}));st('cmi.core.lesson_location',cur+'.'+scr);cm()},
  result(score,ok){if(!api)return;
   st('cmi.core.score.min',0);st('cmi.core.score.max',100);st('cmi.core.score.raw',score*10);
   if(ok){passed=true;st('cmi.core.lesson_status','passed')}else if(!passed){st('cmi.core.lesson_status','failed')}
   this.sync()},
  end(){if(!api||closed)return;closed=true;
   st('cmi.core.session_time',fmt(Date.now()-t0));st('cmi.core.exit',passed?'':'suspend');cm();try{api.LMSFinish('')}catch(e){}}
 }})();
if(!SC.active()){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)ST=Object.assign(ST,x)}catch(e){}}
const save=()=>{if(SC.active())SC.sync();else{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}};
window.addEventListener('pagehide',()=>SC.end());window.addEventListener('beforeunload',()=>SC.end());window.addEventListener('unload',()=>SC.end());
/* ===== Voix off ===== */
let voiceOn=true;try{voiceOn=localStorage.getItem('fd-voice')!=='0'}catch(e){}
const AUD=new Audio();AUD.preload='auto';
function updV(){const pl=$('#vplay'),mu=$('#vmute');if(!pl)return;pl.textContent=AUD.paused?'▶ Écouter':'⏸ Pause';mu.textContent=voiceOn?'🔊 Voix off activée':'🔇 Voix off coupée';mu.setAttribute('aria-pressed',voiceOn)}
function voice(key){
 AUD.pause();const t=$('#vtxt');if(t)t.textContent=NARR[key]||'';
 AUD.src='audio/'+key+'.mp3';
 if(voiceOn){const p=AUD.play();if(p&&p.catch)p.catch(()=>{})}
 updV();
}
['play','pause','ended'].forEach(e=>AUD.addEventListener(e,updV));
const L=['A','B','C','D'];

/* QCM générique : opts=[texte], ok=index, why=explication */
function mcq(root,{opts,ok,why,okMsg='Bonne réponse !',koMsg='Pas tout à fait.',onDone}){
  const box=document.createElement('div');
  box.innerHTML=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${L[i]}</span><span>${o}</span></button>`).join('')}</div><div class="fb" role="status" aria-live="polite"></div>`;
  root.appendChild(box);
  const fb=$('.fb',box);
  $$('.opt',box).forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;const good=i===ok;
    $$('.opt',box).forEach(x=>{x.disabled=true});
    b.classList.add(good?'right':'wrong');
    if(!good)$$('.opt',box)[ok].classList.add('right');
    fb.className='fb show '+(good?'ok':'ko');
    fb.innerHTML=`<b>${good?okMsg:koMsg}</b> ${why}`;
    onDone&&onDone(good,i);
  }));
}
const img=(k,cap='',alt='')=>`<div class="imgc"><img src="${IMG[k]}" alt="${alt||cap}">${cap?`<div class="cap">${cap}</div>`:''}</div>`;

function sockSVG(v){

  const node=(x,y,col,t,tc='#fff')=>`<g><circle cx="${x}" cy="${y}" r="24" fill="${col}"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="18" font-weight="800" fill="${tc}">${t}</text></g>`;
  return `<svg class="sock" viewBox="0 0 360 270" width="100%" role="img" aria-label="Mesures phase, neutre, terre">
  ${line(64,56,296,56,v.pn.ok)}${line(64,56,180,222,v.pt.ok)}${line(296,56,180,222,v.nt.ok)}
  ${lab(180,56,v.pn.v+' V',v.pn.ok)}${lab(104,142,v.pt.v+' V',v.pt.ok)}${lab(256,142,v.nt.v+' V',v.nt.ok)}
  ${node(64,56,'#8a4b1f','P')}${node(296,56,'#1b5fc1','N')}${node(180,222,'#e0b400','T','#111')}
  <text x="64" y="100" text-anchor="middle" font-size="13" fill="#555">Phase</text>
  <text x="296" y="100" text-anchor="middle" font-size="13" fill="#555">Neutre</text>
  <text x="180" y="262" text-anchor="middle" font-size="13" fill="#555">Terre</text></svg>`;
}

 conf:{n:'Prise conforme',pn:{v:230,ok:1},pt:{v:230,ok:1},nt:{v:0,ok:1},go:1,txt:'Tensions attendues : Phase↔Neutre ≈ 230 V, Phase↔Terre ≈ 230 V, Neutre↔Terre ≈ 0 V.',act:'Branchement autorisé (sous réserve des autres contrôles).'},

 st:{n:'Absence de terre',pn:{v:230,ok:1},pt:{v:0,ok:0},nt:{v:0,ok:1},go:0,txt:'Aucune tension entre Phase et Terre : la prise n’a pas de terre.',act:'Aucun matériel GEM de classe I sur une prise sans terre. Je refuse le raccordement, je trace, électricien.'},
 nc:{n:'Neutre coupé',pn:{v:0,ok:0},pt:{v:0,ok:0},nt:{v:0,ok:1},go:0,txt:'0 V partout mais les voyants du VAT clignotent : le neutre est coupé.',act:'Je ne branche pas. Électricien obligatoire.'}
};

/* ===== Contenu des items ===== */
const MODS=[
{id:1,title:'Cadre et contrôle de la prise',short:'Cadre & prise',min:5,screens:[

 {t:'À vous de décider',html:()=>`

 {t:'À retenir',html:()=>`

function home(){
 app.innerHTML=`<div class="hero"><img src="${IMG.logo}" alt="Académie Fnac Darty"><div style="position:relative;z-index:1;padding-right:70px"><p class="kicker" style="color:var(--yellow)">E‑learning · Livraison & installation</p><h2>Installation électrique : ce que je peux faire… et ce que je refuse</h2><p class="lead">Gros électroménager et TV : vos limites d’intervention, les contrôles autorisés avant la mise en service, et les cas où l’on s’arrête.</p></div></div>
 <div class="path">${MODS.map((m,i)=>`<button data-m="${i}"><div class="num">${m.id}</div><b>${m.quiz?'Quiz final':m.title}</b><div class="mn">≈ ${m.min} min${m.quiz?' · 10 questions':''}${ST.done[m.id]?' · ✓ terminé':''}</div></button>`).join('')}</div>
 <div class="callout" style="margin-top:18px"><b>Durée totale : environ 18 minutes.</b> Suivez les items dans l’ordre puis validez avec le quiz (8 bonnes réponses sur 10).${ST.best!=null?` Votre meilleur score : <b>${ST.best}/10</b>.`:''}</div>
 <div class="foot"><span></span><button class="btn y" id="start">Commencer l’item 1 ›</button></div>`;
 $$('.path button',app).forEach(b=>b.onclick=()=>go(+b.dataset.m,0));$('#start').onclick=()=>go(0,0);
}
function render(){
 updTop();
 if(cur<0){home();voice('home');return}
 const m=MODS[cur];
 if(m.quiz){quiz();return}
 const S=m.screens,s=S[scr];
 app.innerHTML=`<section class="screen" id="sc">${s.html()}</section><div class="foot"><button class="btn ghost" id="pv" ${scr===0&&cur===0?'disabled':''}>‹ Précédent</button><div class="dots">${S.map((_,i)=>`<i class="${i===scr?'on':i<scr?'past':''}"></i>`).join('')}</div><button class="btn y" id="nx">${scr===S.length-1?(cur<total-1?(MODS[cur+1].quiz?'Passer au quiz ›':'Item suivant ›'):'Terminer'):'Suivant ›'}</button></div>`;
 s.init&&s.init($('#sc'));
 voice('m'+m.id+'_s'+(scr+1));
 $('#pv').onclick=()=>{if(scr>0)go(cur,scr-1);else if(cur>0)go(cur-1,MODS[cur-1].screens?MODS[cur-1].screens.length-1:0);else go(-1,0)};
 $('#nx').onclick=()=>{
  if(scr<S.length-1)go(cur,scr+1);
  else{ST.done[m.id]=1;save();go(cur+1,0)}
 };
 if(scr===S.length-1){ST.done[m.id]=1;updTop()}
 save();
}
function quiz(){
 let i=0,sc=0;const miss=[];
 const draw=()=>{
  if(i>=QUIZ.length)return result();
  const q=QUIZ[i];voice('q'+(i+1));
  app.innerHTML=`<section class="screen"><p class="kicker">Quiz final · Question ${i+1}/${QUIZ.length}</p><div class="qbar"><i style="width:${i/QUIZ.length*100}%"></i></div><h2 style="font-size:24px">${q.q}</h2><div id="qq"></div></section>`;
  mcq($('#qq'),{opts:q.o,ok:q.ok,why:q.w,onDone:g=>{if(g)sc++;else miss.push(i);const b=document.createElement('button');b.className='btn y';b.style.marginTop='14px';b.textContent=i+1<QUIZ.length?'Question suivante ›':'Voir mon résultat';b.onclick=()=>{i++;draw()};$('#qq').appendChild(b);b.focus()}});
 };
 const result=()=>{
  const pass=sc>=8;if(ST.best==null||sc>ST.best)ST.best=sc;if(pass)ST.done[4]=1;save();SC.result(sc,pass);updTop();voice(pass?'res_ok':'res_ko');
  app.innerHTML=`<section class="screen" style="text-align:center"><p class="kicker">Résultat du quiz</p><div class="score" style="color:${pass?'var(--green)':'var(--red)'}">${sc}/10</div><h2 style="margin-top:10px">${pass?'Module validé, bravo !':'Pas encore validé (8/10 requis)'}</h2><p class="lead">${pass?'Vous connaissez les limites de votre intervention. En cas de doute sur le terrain : je ne branche pas, je préviens, je trace.':'Revoyez les items concernés puis retentez le quiz.'}</p>
  ${miss.length?`<div class="box" style="text-align:left;margin:16px 0"><h3>Questions à revoir</h3><ul class="l">${miss.map(k=>`<li><b>${QUIZ[k].q}</b><br><span style="color:var(--green)">✓ ${QUIZ[k].o[QUIZ[k].ok]}</span></li>`).join('')}</ul></div>`:''}
  <div class="foot" style="justify-content:center"><button class="btn ghost" id="rv">Revoir les items</button><button class="btn y" id="rt">Refaire le quiz</button></div></section>`;
  $('#rv').onclick=()=>go(-1,0);$('#rt').onclick=()=>go(3,0);
 };
 draw();
}
$('#vplay').onclick=()=>{if(AUD.paused){if(!AUD.src)voice(vk());else AUD.play().catch(()=>{})}else AUD.pause()};
$('#vmute').onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('fd-voice',voiceOn?'1':'0')}catch(e){}if(!voiceOn)AUD.pause();else AUD.play().catch(()=>{});updV()};
const vk=()=>cur<0?'home':'m'+MODS[cur].id+'_s'+(scr+1);
const sd=SC.init();
if(sd){ST.done=Object.assign(ST.done,sd.d||{});if(sd.b!=null)ST.best=sd.b;if(sd.l&&sd.l[0]>=0&&sd.l[0]<3){cur=sd.l[0];scr=sd.l[1]||0}}
buildNav();render();updV();
</script>
</body></html>
